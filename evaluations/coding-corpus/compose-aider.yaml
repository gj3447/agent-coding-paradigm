x-corpus-sandbox: &corpus-sandbox
  init: true
  command: ["sleep", "infinity"]
  user: "10001:10001"
  environment:
    HOME: /tmp/home
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 2g
  pids_limit: 256
  cpus: 1.5
  tmpfs:
    - /workspace:size=1g,mode=0755,uid=10001,gid=10001,exec
    - /opt/coding-corpus:size=128m,mode=0755,uid=10001,gid=10001
    - /tmp:size=256m,mode=1777,exec

x-verifier-sandbox: &verifier-sandbox
  <<: *corpus-sandbox
  image: flrh-coding-corpus:aider-pilot-verifier
  build:
    context: .
    target: default
  network_mode: none

services:
  default:
    <<: *corpus-sandbox
    image: flrh-coding-corpus:aider-0.86.2-pilot
    build:
      context: .
      target: aider
    environment:
      HOME: /tmp/home
      OPENAI_API_BASE: http://model-gateway:8080/v1
      OPENAI_API_KEY: candidate-placeholder-no-authority
    networks:
      - model_plane
    depends_on:
      model-gateway:
        condition: service_healthy

  model-gateway:
    image: flrh-coding-corpus:model-gateway-pilot
    build:
      context: .
      target: gateway
    init: true
    user: "1000:1000"
    environment:
      MODEL_GATEWAY_UPSTREAM_HOST: ${MODEL_GATEWAY_UPSTREAM_HOST:?set MODEL_GATEWAY_UPSTREAM_HOST}
      MODEL_GATEWAY_UPSTREAM_PORT: ${MODEL_GATEWAY_UPSTREAM_PORT:?set MODEL_GATEWAY_UPSTREAM_PORT}
    secrets:
      - source: dgx_api_key
        target: dgx_api_key
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    cpus: 0.5
    tmpfs:
      - /tmp/gateway:size=8m,mode=0700,uid=1000,gid=1000
    expose:
      - "8080"
    networks:
      model_plane: {}
      dgx_egress:
        gw_priority: 1
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "--no-strip-types",
          "/opt/model-gateway/dist/gateway-cli.js",
          "healthcheck",
        ]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    stop_grace_period: 15s

  verifier:
    <<: *verifier-sandbox

  oracle:
    <<: *verifier-sandbox

networks:
  model_plane:
    internal: true
  dgx_egress: {}

secrets:
  dgx_api_key:
    file: ${DGX_API_KEY_FILE:?set DGX_API_KEY_FILE to the scoped container-readable key copy}

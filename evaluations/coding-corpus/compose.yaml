x-sandbox: &sandbox
  image: flrh-coding-corpus:pilot-2
  init: true
  command: ["sleep", "infinity"]
  user: "10001:10001"
  environment:
    HOME: /tmp/home
  read_only: true
  network_mode: none
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 2g
  pids_limit: 256
  cpus: 1.5
  tmpfs:
    - /workspace:size=1g,mode=0755,uid=10001,gid=10001,exec
    - /opt/coding-corpus:size=128m,mode=0755,uid=10001,gid=10001
    - /tmp:size=256m,mode=1777,exec

services:
  default:
    <<: *sandbox
    build:
      context: .
  verifier:
    <<: *sandbox
  oracle:
    <<: *sandbox

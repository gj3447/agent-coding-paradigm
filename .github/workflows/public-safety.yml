name: Public safety and research admissions

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-m0.txt
      - run: python -m pip install -r requirements-m0.txt
      - run: python scripts/validate_consumer_samples.py
      - run: python scripts/check_agent_rule_routes.py
      - run: python scripts/validate_agent_source_registry.py
      - run: >-
          python -m unittest
          tests.test_consumer_samples
          tests.test_agent_rule_routes
          tests.test_agent_source_registry
          -v

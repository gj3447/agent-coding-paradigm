name: M0 contract conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  m0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-m0.txt
      - run: python -m pip install -r requirements-m0.txt
      - run: python scripts/validate_m0.py
      - run: python -m unittest discover -s tests -v

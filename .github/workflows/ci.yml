name: M0, M1, M2, M3, and LR seam conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-m0.txt
      - run: python -m pip install -r requirements-m0.txt
      - run: python scripts/validate_m0.py
      - run: python scripts/validate_m1.py
      - run: python scripts/validate_m2.py
      - run: python scripts/validate_m3.py
      - run: python scripts/validate_lr_seam.py
      - run: python -m unittest discover -s tests -v
